spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/db_clientes}
    username: ${DB_USERNAME:rapidouser}
    password: ${DB_PASSWORD:rapidopass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

reniec:
  api:
    url: ${RENIEC_API_URL}
    token: ${RENIEC_API_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
resilience4j:
  circuitbreaker:
    instances:
      reniecCB:
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        slidingWindowSize: 5


logging:
  level:
    com.rapidocourier: DEBUG