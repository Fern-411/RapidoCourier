spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/db_paquetes}
    username: ${DB_USERNAME:rapidouser}
    password: ${DB_PASSWORD:rapidopass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: "*"
paquetes:
  tarifa:
    base: 10.00
    costo-peso: 5.00


# Reglas de tarifa — configurables en caliente con @RefreshScope
tarifa:
  base-kg: 3.50
  por-km: 0.015
  porcentaje-seguro: 0.005

logging:
  level:
    com.rapidocourier: DEBUG