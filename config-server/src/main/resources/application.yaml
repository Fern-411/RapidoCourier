server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          # Para Docker: montaremos el repo en esta ruta. Si lo corres local, usa file://${user.home}/rapidocourier-config
          uri: ${GIT_REPO_URI:file:///config-repo}
          default-label: main
          clone-on-start: true
          timeout: 5

eureka:
  client:
    service-url:
    defaultZone: http://eureka-server:8761/eureka/
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh