# === application.yaml ===
server:
  port: 8083

spring:
  cloud:
    compatibility-verifier:
      enabled: false
  application:
    name: servicio-pagos
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL}"
  datasource:
    # Atrapa la URL dinámica inyectada por el docker-compose
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/db_pagos}
    username: ${DB_USERNAME:rapidouser}
    password: ${DB_PASSWORD:rapidopass}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ── Configuración de Eureka ──
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true

# ── Endpoints de Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

logging:
  level:
    com.rapidocourier: DEBUG
    org.springframework.web: DEBUG
    com.fasterxml.jackson: DEBUG