# === application.yaml ===
server:
  port: 8082

spring:
  application:
    name: servicio-paquetes
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL}"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/db_paquetes}
    username: ${DB_USERNAME:rapidouser}
    password: ${DB_PASSWORD:rapidopass}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}

# ── Configuración de Eureka ──
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true

# ── Endpoints de Actuator (Incluye resiliencia) ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,circuitbreakers

logging:
  level:
    com.rapidocourier: DEBUG