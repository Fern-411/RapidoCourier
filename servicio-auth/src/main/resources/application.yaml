# === application.yaml ===
server:
  port: 8085

spring:
  application:
    name: servicio-auth
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/db_auth}
    username: ${DB_USERNAME:rapidouser}
    password: ${DB_PASSWORD:rapidopass}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ── Configuración de Eureka ──
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true # Crucial para el ruteo interno en la red de Docker

# ── Configuración de Seguridad JWT (Sección 10) ──

app:
  jwt:
    # Atrapa las variables inyectadas por el docker-compose
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration-ms: 604800000  # 7 días
  security:
    max-login-attempts: 5           # v1.5: Umbral de bloqueo de cuenta
    lockout-duration-minutes: 15
  admin:
    default-email: ${ADMIN_EMAIL:admin@rapidocourier.com}  # v1.5: Configurable
    default-password: ${ADMIN_PASSWORD:admin123456}       # v1.5: Desde env var
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
    github:
      client-id: ${GITHUB_CLIENT_ID}
      client-secret: ${GITHUB_CLIENT_SECRET}

# ── Endpoints de Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

logging:
  level:
    # Corregido de pe.rapidocourier a com.rapidocourier
    com.rapidocourier: DEBUG
    org.springframework.web: DEBUG